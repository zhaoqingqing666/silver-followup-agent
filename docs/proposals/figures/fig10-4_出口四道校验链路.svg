<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<rect x="0" y="0" width="1200" height="480" fill="#FFFFFF"/>
<defs>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar4r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">图 10-4　高风险操作出口：四道校验链路</text>
<rect x="40" y="110" width="150" height="124" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="115" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#791F1F">模型提议</text>
<text x="115" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#A32D2D">只能提议</text>
<text x="115" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#A32D2D">不能执行</text>
<rect x="222" y="110" width="160" height="124" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="302" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">① 状态检查</text>
<text x="302" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">对话未结束</text>
<text x="302" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">未被取消 / 冻结</text>
<rect x="414" y="110" width="160" height="124" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="494" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">② 内容有效</text>
<text x="494" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">确认单未过期</text>
<text x="494" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">内容一变即失效</text>
<rect x="606" y="110" width="160" height="124" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="686" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">③ 用户确认</text>
<text x="686" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">本人点过那一次</text>
<text x="686" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">不是模型替他理解</text>
<rect x="798" y="110" width="160" height="124" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="878" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">④ 一次性执行</text>
<text x="878" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">用过即作废</text>
<text x="878" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">执行前再核权限</text>
<rect x="990" y="110" width="170" height="124" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="1075" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="500" fill="#085041">写库</text>
<text x="1075" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#0F6E56">唯一入口</text>
<text x="1075" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#0F6E56">只认这四道</text>
<line x1="190" y1="172" x2="216" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar4)"/>
<line x1="382" y1="172" x2="408" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar4)"/>
<line x1="574" y1="172" x2="600" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar4)"/>
<line x1="766" y1="172" x2="792" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar4)"/>
<line x1="958" y1="172" x2="984" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar4)"/>
<line x1="302" y1="234" x2="302" y2="296" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="494" y1="234" x2="494" y2="296" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="686" y1="234" x2="686" y2="296" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="878" y1="234" x2="878" y2="296" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="878" y1="296" x2="150" y2="296" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="150" y1="296" x2="150" y2="242" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar4r)"/>
<text x="514" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#A32D2D">任何一道没过 → 退回对话，正事原地不动，老人可以接着办</text>
<rect x="40" y="356" width="1120" height="84" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="64" y="388" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">四道是「与」的关系，少一道都写不进去；模型只在这条链路的左侧，它能写库的路径根本不存在。</text>
<text x="64" y="416" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">所以过程可以很软（跳答、改主意、跑题聊天），出口必须很硬——这正是这套设计值得信任的地方。</text>
</svg>
