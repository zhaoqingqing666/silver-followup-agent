<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<rect x="0" y="0" width="1200" height="400" fill="#FFFFFF"/>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">图 10-3　数据最小化：从采集到不落库</text>
<rect x="40" y="110" width="250" height="124" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="165" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#444441">① 数据采集</text>
<text x="165" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5F5E5A">对话 · 工具参数 · 图片</text>
<text x="165" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5F5E5A">天然带着业务细节</text>
<rect x="330" y="110" width="280" height="124" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="470" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">② 最小化过滤</text>
<text x="470" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">手机号遮中间四位 · 密钥抹掉</text>
<text x="470" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">超长字段截断</text>
<rect x="650" y="110" width="250" height="124" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="775" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#0C447C">③ 内存临时留存</text>
<text x="775" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#185FA5">单会话 40 条 · 上限 500 会话</text>
<text x="775" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#185FA5">停活动 5 分钟即释放</text>
<rect x="940" y="110" width="220" height="124" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1050" y="152" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#085041">④ 不长期落库</text>
<text x="1050" y="186" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#0F6E56">不写数据库</text>
<text x="1050" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#0F6E56">看完就不需要了</text>
<line x1="290" y1="172" x2="324" y2="172" stroke="#5F5E5A" stroke-width="4" marker-end="url(#ar3)"/>
<line x1="610" y1="172" x2="644" y2="172" stroke="#5F5E5A" stroke-width="2.5" marker-end="url(#ar3)"/>
<line x1="900" y1="172" x2="934" y2="172" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar3)"/>
<line x1="920" y1="86" x2="920" y2="258" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 5"/>
<text x="920" y="74" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="500" fill="#A32D2D">断在这里</text>
<rect x="40" y="286" width="1120" height="84" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="64" y="318" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">最后一段是「断」的——不是「先存起来、展示的时候再打码」。箭头由粗变细，表示数据逐级变少。</text>
<text x="64" y="346" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">数据少留一份就少一个泄露面；风险是设计掉的，不是靠人工管出来的。</text>
</svg>
