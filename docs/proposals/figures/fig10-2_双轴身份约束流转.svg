<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">图 10-2　双轴身份约束流转</text>
<rect x="40" y="88" width="240" height="76" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="160" y="118" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#444441">照护关系表</text>
<text x="160" y="144" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5F5E5A">谁在照护谁 · 后端维护</text>
<line x1="280" y1="126" x2="324" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="330" y="88" width="260" height="76" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="460" y="118" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#854F0B">核验通过才建会话</text>
<text x="460" y="144" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#633806">前端传的身份一概不采信</text>
<path d="M460 164 V186 H140 V372" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="140" y1="240" x2="194" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="140" y1="372" x2="194" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="200" y="190" width="440" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="420" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#0C447C">数据轴 · 服务谁</text>
<text x="420" y="256" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#185FA5">数据取值 · 预约归属 · 写库目标</text>
<rect x="200" y="322" width="440" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="420" y="356" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#085041">能力轴 · 谁在操作</text>
<text x="420" y="388" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#0F6E56">工具过滤 · 执行前再判一次 · 关系称呼</text>
<line x1="640" y1="240" x2="694" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="640" y1="372" x2="694" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="700" y="190" width="460" height="232" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="930" y="280" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="500" fill="#2C2C2A">写库 · 唯一出口</text>
<text x="930" y="312" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5F5E5A">两条轴只在这一个点汇合</text>
<text x="930" y="336" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5F5E5A">汇合之后各自不再被引用</text>
<rect x="40" y="452" width="1120" height="84" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="64" y="484" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">两条轴互不混用：数据轴决定「办谁的事」，能力轴只决定「谁有资格办、该怎么说」。</text>
<text x="64" y="512" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#444441">所以即使模型说错了话、或者有人改了前端，也改变不了这笔业务到底办的是谁的事。</text>
</svg>
