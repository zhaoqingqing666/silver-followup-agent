<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2540" viewBox="0 0 1800 2540" role="img" aria-labelledby="title desc">
  <title id="title">银龄复诊受控混合智能体总体架构与核心数据流</title>
  <desc id="desc">展示老人、家属和志愿者通过适老前端进入 Spring Boot 会话编排，由单一主模型提出计划，Java 运行时执行工具契约、权限和确认检查，领域工具与执行器访问 H2 权威数据库并返回结构化结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#f6f8fb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526678"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286f9f"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#183247} .title{font-size:38px;font-weight:700}.subtitle{font-size:18px;fill:#5b7082}.groupTitle{font-size:22px;font-weight:700}.nodeTitle{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#53687a}.tiny{font-size:14px;fill:#5b7082}.tag{font-size:14px;font-weight:700}.line{stroke:#526678;stroke-width:3;fill:none;marker-end:url(#arrow)}.lineBlue{stroke:#286f9f;stroke-width:3.2;fill:none;marker-end:url(#arrowBlue)}.dash{stroke:#7a8894;stroke-width:2.4;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}.group{fill:#fff;stroke:#c9d5de;stroke-width:2}.user{fill:#edf6ff;stroke:#4b89b9;stroke-width:2}.front{fill:#effaf5;stroke:#3d9879;stroke-width:2}.api{fill:#fff8e8;stroke:#c28b25;stroke-width:2}.runtime{fill:#f6f1ff;stroke:#8065b7;stroke-width:2}.guard{fill:#fff1f1;stroke:#c05a5a;stroke-width:2}.tool{fill:#f1f5f8;stroke:#63798c;stroke-width:2}.db{fill:#e9eef3;stroke:#425d73;stroke-width:3}.result{fill:#edf7ff;stroke:#357faf;stroke-width:2}.pillBlue{fill:#dbeeff}.pillRed{fill:#ffe1e1}.pillGray{fill:#e6edf2}.white{fill:#fff}.accent{fill:#286f9f}.red{fill:#a93636}.green{fill:#26785e}
    </style>
  </defs>
  <rect width="1800" height="2540" fill="url(#bg)"/>
  <text x="900" y="62" text-anchor="middle" class="title">银龄复诊受控混合智能体总体架构与核心数据流</text>
  <text x="900" y="96" text-anchor="middle" class="subtitle">单一主模型提出建议 · Java 运行时审核执行 · 工具与数据库提供权威事实</text>

  <!-- 用户入口 -->
  <g filter="url(#shadow)"><rect x="90" y="130" width="1620" height="170" rx="22" class="group"/></g>
  <text x="125" y="170" class="groupTitle">① 用户与统一交互入口</text>
  <rect x="130" y="192" width="250" height="70" rx="16" class="user"/><text x="255" y="222" text-anchor="middle" class="nodeTitle">老人本人</text><text x="255" y="247" text-anchor="middle" class="small">本人办理</text>
  <rect x="410" y="192" width="250" height="70" rx="16" class="user"/><text x="535" y="222" text-anchor="middle" class="nodeTitle">家属</text><text x="535" y="247" text-anchor="middle" class="small">经照护关系校验</text>
  <rect x="690" y="192" width="250" height="70" rx="16" class="user"/><text x="815" y="222" text-anchor="middle" class="nodeTitle">志愿者</text><text x="815" y="247" text-anchor="middle" class="small">限定服务对象</text>
  <rect x="1000" y="185" width="660" height="84" rx="18" class="user"/><text x="1330" y="219" text-anchor="middle" class="nodeTitle">统一输入</text><text x="1330" y="248" text-anchor="middle" class="body">文字 ｜ 语音 ｜ 按钮 ｜ 确认卡 ｜ 材料图片</text>
  <path d="M255 262 V280 H1330 V269" class="line"/><path d="M535 262 V280" class="line"/><path d="M815 262 V280" class="line"/>

  <!-- 前端 -->
  <path d="M900 300 V340" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="90" y="345" width="1620" height="170" rx="22" class="front"/></g>
  <text x="125" y="385" class="groupTitle">② React + TypeScript 适老前端</text>
  <rect x="130" y="410" width="350" height="70" rx="14" class="white"/><text x="305" y="440" text-anchor="middle" class="nodeTitle">输入采集</text><text x="305" y="465" text-anchor="middle" class="small">识别文本与当前页面上下文</text>
  <rect x="505" y="410" width="350" height="70" rx="14" class="white"/><text x="680" y="440" text-anchor="middle" class="nodeTitle">可信展示</text><text x="680" y="465" text-anchor="middle" class="small">结构化卡片与快捷选项</text>
  <rect x="880" y="410" width="350" height="70" rx="14" class="white"/><text x="1055" y="440" text-anchor="middle" class="nodeTitle">语音交互</text><text x="1055" y="465" text-anchor="middle" class="small">播报、转写与原话回放</text>
  <rect x="1255" y="410" width="405" height="70" rx="14" class="white"/><text x="1458" y="440" text-anchor="middle" class="nodeTitle">白名单页面导航</text><text x="1458" y="465" text-anchor="middle" class="small">不从回复文字猜测业务结果</text>

  <!-- API and identity -->
  <path d="M900 515 V555" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="90" y="560" width="1120" height="260" rx="22" class="api"/></g>
  <text x="125" y="600" class="groupTitle">③ Spring Boot 接口层与会话编排</text>
  <rect x="130" y="625" width="500" height="75" rx="14" class="white"/><text x="380" y="655" text-anchor="middle" class="nodeTitle">AgentController</text><text x="380" y="682" text-anchor="middle" class="small">会话 / 消息 / 图片 / 动作 / 确认接口</text>
  <rect x="670" y="625" width="500" height="75" rx="14" class="white"/><text x="920" y="655" text-anchor="middle" class="nodeTitle">FollowupAgentService</text><text x="920" y="682" text-anchor="middle" class="small">恢复状态 · 推进阶段 · 组合统一响应</text>
  <rect x="130" y="725" width="500" height="65" rx="14" class="white"/><text x="380" y="753" text-anchor="middle" class="nodeTitle">ConversationStore</text><text x="380" y="778" text-anchor="middle" class="small">会话快照、历史、身份与确认状态</text>
  <rect x="670" y="725" width="500" height="65" rx="14" class="guard"/><text x="920" y="753" text-anchor="middle" class="nodeTitle">SafetyGuard / MedicalBoundaryRules</text><text x="920" y="778" text-anchor="middle" class="small">紧急表达、医疗越界、访问权限优先拦截</text>
  <path d="M630 663 H670" class="line"/><path d="M380 700 V725" class="line"/><path d="M920 700 V725" class="line"/>

  <g filter="url(#shadow)"><rect x="1240" y="560" width="470" height="260" rx="22" class="group"/></g>
  <text x="1275" y="600" class="groupTitle">双轴身份边界</text>
  <rect x="1280" y="625" width="390" height="68" rx="14" class="user"/><text x="1475" y="653" text-anchor="middle" class="nodeTitle">actorUserId + actorRole</text><text x="1475" y="678" text-anchor="middle" class="small">谁在操作 / 决定角色能力</text>
  <rect x="1280" y="715" width="390" height="68" rx="14" class="user"/><text x="1475" y="743" text-anchor="middle" class="nodeTitle">userId</text><text x="1475" y="768" text-anchor="middle" class="small">服务哪位老人 / 决定数据归属</text>
  <text x="1475" y="805" text-anchor="middle" class="tiny">care_relations 校验；身份不由模型或前端决定</text>
  <path d="M1240 690 H1210" class="line"/>

  <!-- Runtime -->
  <path d="M900 820 V860" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="90" y="865" width="1620" height="470" rx="22" class="runtime"/></g>
  <text x="125" y="905" class="groupTitle">④ 受控智能体运行时 AgentRuntime</text>
  <rect x="130" y="935" width="570" height="115" rx="18" class="white"/><text x="415" y="970" text-anchor="middle" class="nodeTitle">ConversationPlanner / 单一主模型</text><text x="415" y="998" text-anchor="middle" class="body">理解意图 · 抽取事实 · 自然补问 · 提议工具</text><text x="415" y="1027" text-anchor="middle" class="small">不能直接访问数据库，也不能直接宣布业务成功</text>
  <rect x="770" y="935" width="430" height="115" rx="18" class="runtime"/><text x="985" y="970" text-anchor="middle" class="nodeTitle">AgentRuntime</text><text x="985" y="998" text-anchor="middle" class="body">采纳结构化计划</text><text x="985" y="1027" text-anchor="middle" class="small">控制调用、续跑、停止与降级</text>
  <rect x="1270" y="935" width="390" height="115" rx="18" class="white"/><text x="1465" y="970" text-anchor="middle" class="nodeTitle">规则降级路径</text><text x="1465" y="998" text-anchor="middle" class="body">RuleConversationPlanner</text><text x="1465" y="1027" text-anchor="middle" class="small">仅模型不可用或调用失败时启用</text>
  <path d="M700 992 H770" class="lineBlue"/><path d="M770 1020 H700" class="lineBlue"/><path d="M1270 992 H1200" class="dash"/>

  <rect x="130" y="1090" width="330" height="105" rx="16" class="white"/><text x="295" y="1123" text-anchor="middle" class="nodeTitle">ToolRegistry</text><text x="295" y="1152" text-anchor="middle" class="body">工具声明与角色范围</text><text x="295" y="1179" text-anchor="middle" class="small">模型只看被开放的能力</text>
  <rect x="485" y="1090" width="330" height="105" rx="16" class="guard"/><text x="650" y="1123" text-anchor="middle" class="nodeTitle">ToolPolicy</text><text x="650" y="1152" text-anchor="middle" class="body">角色与风险权限</text><text x="650" y="1179" text-anchor="middle" class="small">只读 / 澄清 / 确认分离</text>
  <rect x="840" y="1090" width="330" height="105" rx="16" class="guard"/><text x="1005" y="1123" text-anchor="middle" class="nodeTitle">ToolContract</text><text x="1005" y="1152" text-anchor="middle" class="body">统一参数契约判罚</text><text x="1005" y="1179" text-anchor="middle" class="small">类型、必填、枚举、字段组合</text>
  <rect x="1195" y="1090" width="465" height="105" rx="16" class="guard"/><text x="1428" y="1123" text-anchor="middle" class="nodeTitle">ActionValidator / AgentOrchestrator</text><text x="1428" y="1152" text-anchor="middle" class="body">回答安全与业务路线审核</text><text x="1428" y="1179" text-anchor="middle" class="small">不让自然回复绕过正式流程</text>
  <path d="M460 1142 H485" class="line"/><path d="M815 1142 H840" class="line"/><path d="M1170 1142 H1195" class="line"/>
  <rect x="300" y="1230" width="1200" height="70" rx="35" class="pillBlue"/><text x="900" y="1258" text-anchor="middle" class="nodeTitle">有界多工具循环</text><text x="900" y="1283" text-anchor="middle" class="body">最多 3 轮 ｜ 最多 3 个互不依赖的只读工具 ｜ “工具名＋参数”拦截重复调用</text>

  <!-- channels -->
  <path d="M900 1335 V1375" class="lineBlue"/>
  <text x="900" y="1400" text-anchor="middle" class="groupTitle">⑤ 三条严格隔离的处理通道</text>
  <rect x="90" y="1425" width="500" height="170" rx="20" class="tool" filter="url(#shadow)"/><text x="340" y="1465" text-anchor="middle" class="nodeTitle">只读工具通道</text><text x="340" y="1495" text-anchor="middle" class="body">通过权限与契约校验后自动执行</text><text x="340" y="1524" text-anchor="middle" class="small">医院、科室、号源、日程、材料、路线</text><text x="340" y="1551" text-anchor="middle" class="small">画像、药品、健康记录、联系人等查询</text><rect x="208" y="1567" width="264" height="6" rx="3" class="accent"/>
  <rect x="650" y="1425" width="500" height="170" rx="20" class="api" filter="url(#shadow)"/><text x="900" y="1465" text-anchor="middle" class="nodeTitle">澄清通道</text><text x="900" y="1495" text-anchor="middle" class="body">ClarificationInteractionTool</text><text x="900" y="1524" text-anchor="middle" class="small">从数据库查询真实候选，再展示问题和按钮</text><text x="900" y="1551" text-anchor="middle" class="small">只弄清对象，不签发凭据，不写数据库</text><rect x="768" y="1567" width="264" height="6" rx="3" fill="#c28b25"/>
  <rect x="1210" y="1425" width="500" height="170" rx="20" class="guard" filter="url(#shadow)"/><text x="1460" y="1465" text-anchor="middle" class="nodeTitle">高风险写操作申请</text><text x="1460" y="1495" text-anchor="middle" class="body">ConfirmationInteractionTool</text><text x="1460" y="1524" text-anchor="middle" class="small">只能申请生成确认卡，不能直接执行</text><text x="1460" y="1551" text-anchor="middle" class="small">预约、取消、提醒、通知、备忘等</text><rect x="1328" y="1567" width="264" height="6" rx="3" class="red"/>

  <!-- tools and confirmation -->
  <path d="M340 1595 V1640" class="line"/><path d="M900 1595 V1640" class="line"/><path d="M1460 1595 V1640" class="line"/>
  <g filter="url(#shadow)"><rect x="90" y="1645" width="820" height="320" rx="22" class="tool"/></g>
  <text x="125" y="1685" class="groupTitle">⑥ 领域工具与真实业务查询</text>
  <rect x="130" y="1715" width="350" height="80" rx="14" class="white"/><text x="305" y="1747" text-anchor="middle" class="nodeTitle">目录与预约</text><text x="305" y="1775" text-anchor="middle" class="small">医院 · 科室 · 号源 · 我的预约</text>
  <rect x="520" y="1715" width="350" height="80" rx="14" class="white"/><text x="695" y="1747" text-anchor="middle" class="nodeTitle">就诊保障</text><text x="695" y="1775" text-anchor="middle" class="small">日程 · 材料 · 路线 · 院内位置</text>
  <rect x="130" y="1825" width="350" height="80" rx="14" class="white"/><text x="305" y="1857" text-anchor="middle" class="nodeTitle">健康与记忆</text><text x="305" y="1885" text-anchor="middle" class="small">画像 · 药品 · 健康记录 · 备忘</text>
  <rect x="520" y="1825" width="350" height="80" rx="14" class="white"/><text x="695" y="1857" text-anchor="middle" class="nodeTitle">协同照护</text><text x="695" y="1885" text-anchor="middle" class="small">照护时间线 · 联系人 · 通知</text>
  <text x="500" y="1940" text-anchor="middle" class="tiny">工具只完成范围明确的查询或单一业务动作，不决定整个复诊流程</text>

  <g filter="url(#shadow)"><rect x="950" y="1645" width="760" height="510" rx="22" class="guard"/></g>
  <text x="985" y="1685" class="groupTitle">⑦ ConfirmationService 确认凭据与写操作门禁</text>
  <rect x="995" y="1715" width="670" height="75" rx="14" class="white"/><text x="1330" y="1745" text-anchor="middle" class="nodeTitle">签发 confirmationId</text><text x="1330" y="1772" text-anchor="middle" class="small">冻结操作 Kind、完整 targetIds 和执行所需草稿</text>
  <path d="M1330 1790 V1820" class="line"/>
  <rect x="995" y="1825" width="670" height="75" rx="14" class="white"/><text x="1330" y="1855" text-anchor="middle" class="nodeTitle">前端展示完整确认卡</text><text x="1330" y="1882" text-anchor="middle" class="small">复述医院、日期、服务对象、通知对象和影响范围</text>
  <path d="M1330 1900 V1930" class="line"/>
  <polygon points="1330,1935 1480,1990 1330,2045 1180,1990" fill="#fff" stroke="#c05a5a" stroke-width="2"/><text x="1330" y="1984" text-anchor="middle" class="nodeTitle">明确确认？</text><text x="1330" y="2009" text-anchor="middle" class="small">凭据有效且未消费</text>
  <path d="M1180 1990 H1050 V2070" class="line"/><text x="1090" y="1975" class="tag red">否 / 改口</text>
  <rect x="985" y="2075" width="360" height="55" rx="14" class="pillRed"/><text x="1165" y="2109" text-anchor="middle" class="body">旧凭据失效 · 不写数据库</text>
  <path d="M1480 1990 H1600 V2070" class="line"/><text x="1510" y="1975" class="tag green">是</text>
  <rect x="1370" y="2075" width="295" height="55" rx="14" class="pillRed"/><text x="1518" y="2099" text-anchor="middle" class="body">单次消费凭据</text><text x="1518" y="2119" text-anchor="middle" class="tiny">ConfirmationDispatcher</text>

  <!-- executors and DB -->
  <path d="M1518 2130 V2180" class="line"/>
  <rect x="950" y="2185" width="760" height="120" rx="20" class="guard" filter="url(#shadow)"/>
  <text x="1330" y="2223" text-anchor="middle" class="nodeTitle">按签发时冻结的 Kind 分派到真实执行器</text>
  <text x="1330" y="2255" text-anchor="middle" class="body">BookingExecutor · CaregiverBookingExecutor · CancellationExecutor</text>
  <text x="1330" y="2283" text-anchor="middle" class="body">ManagedCancelExecutor · MemoExecutor</text>
  <path d="M500 1965 V2340 H780" class="line"/><path d="M1330 2305 V2340 H1020" class="line"/>

  <g filter="url(#shadow)"><rect x="260" y="2350" width="1280" height="120" rx="26" class="db"/></g>
  <text x="900" y="2390" text-anchor="middle" class="nodeTitle">⑧ H2 模拟数据库：业务事实的最终权威来源</text>
  <text x="900" y="2423" text-anchor="middle" class="body">用户 · 照护关系 · 会话 · 医院 · 科室 · 号源 · 预约 · 日程 · 材料 · 路线</text>
  <text x="900" y="2452" text-anchor="middle" class="body">提醒 · 通知 · 健康记录 · 长期记忆 · 工具调用日志</text>

  <path d="M260 2410 H140 V2488 H650" class="lineBlue"/>
  <rect x="650" y="2485" width="1000" height="42" rx="21" class="result"/>
  <text x="1150" y="2512" text-anchor="middle" class="body">回读真实结果 → 回答 / 候选按钮 / 任务进度 / 确认卡 / 导航指令 / 工具轨迹 → 前端展示</text>
</svg>
