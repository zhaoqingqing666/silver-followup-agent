spring:
  application:
    name: silver-agent-api
  datasource:
    url: jdbc:h2:file:./data/silver-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
agent:
  llm:
    enabled: ${AGENT_LLM_ENABLED:false}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    api-key: ${DEEPSEEK_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info

demo:
  user-id: ${DEMO_USER_ID:user-001}
