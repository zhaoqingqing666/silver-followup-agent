name: silver-followup

services:
  # ------- 后端 Java API（Spring Boot + H2，监听 8080）-------
  backend:
    build:
      context: .
      target: silver-api
    image: silver-api:dev
    container_name: silver-backend
    restart: unless-stopped
    environment:
      # H2 文件库与数据库控制台保持可用
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/silver-agent
      # 模型同时负责自然语言理解与回答；业务状态和工具执行仍由 Java 控制
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-openai-compatible}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_API_KEY_REQUIRED: ${AGENT_MODEL_API_KEY_REQUIRED:-true}
      AGENT_MODEL_JSON_MODE_SUPPORTED: ${AGENT_MODEL_JSON_MODE_SUPPORTED:-true}
      AGENT_MODEL_CONNECT_TIMEOUT_MS: ${AGENT_MODEL_CONNECT_TIMEOUT_MS:-2500}
      AGENT_MODEL_READ_TIMEOUT_MS: ${AGENT_MODEL_READ_TIMEOUT_MS:-12000}
      # CORS 白名单：允许浏览器里的前端页面跨域调用
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/demo/health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ------- 前端（vinext 生产服务器，监听 3000，宿主映射同端口）-------
  frontend:
    build:
      context: .
      target: silver-web
      args:
        # 浏览器访问后端的地址在构建期烧进 JS；换机器演示时改根目录 .env 再重build
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
    image: silver-web:dev
    container_name: silver-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 默认仍访问 localhost:3000；若本机 3000 已被占用，可临时设置 FRONTEND_PORT=3001
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  h2-data:
